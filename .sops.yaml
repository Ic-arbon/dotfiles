# sops 配置文件（仅含公钥，可安全提交）。
#
# 约定：
#   - 每个 age recipient 使用独立的 YAML anchor；
#   - common 密文允许所有机器解密；
#   - 机器专属密文只允许对应机器的 keys。
#
# 添加新机器后，需要在任一已授权机器上运行：
#   sops updatekeys secrets/common/secrets.yaml

keys:
  - &hosts:
      - &tyd_OB714 age15hd22eu4yhxsue6qc39yv83wyrjq6thha7kyfkxdhctqcyhstq3quhjazr
      - &tyd_tydsMBA_host age1ln2z4tsujmj72dcw6e5y7jx68h0xnchsku2ds95qy4udhuhs24nskvzmjs
      - &tyd_tydsMBA_user age13qg6pjvxffunte6ry9vk9e5xewx6sys0fa4hhv9yualz5j27kdws9ecvw0

creation_rules:
  - path_regex: ^secrets/common/secrets\.yaml$
    key_groups:
      - age:
          - *tyd_OB714
          - *tyd_tydsMBA_host
          - *tyd_tydsMBA_user

  - path_regex: ^secrets/hosts/tyd@OB714/secrets\.yaml$
    key_groups:
      - age:
          - *tyd_OB714

  - path_regex: ^secrets/hosts/tyd@tydsMBA/secrets\.yaml$
    key_groups:
      - age:
          - *tyd_tydsMBA_host
          - *tyd_tydsMBA_user
